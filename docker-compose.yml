services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: easybus-postgres
    environment:
      POSTGRES_DB: easybus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easybus-network

  # Spring Boot Backend
