  # # Angular Frontend
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #     args:
  #       - VITE_API_URL=http://localhost:8080
  #       - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
  #   container_name: easybus-frontend
  #   ports:
  #     - "4200:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - easybus-network
  #   restart: unless-stopped

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: easybus-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@easybus.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - easybus-network
    profiles:
      - tools

volumes:
  postgres-data:
    driver: local

networks:
  easybus-network:
    driver: bridge
