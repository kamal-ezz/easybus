  #     APP_JWT_SECRET: ${JWT_SECRET:-ChangeMeToAProperlyLongJwtSigningSecretKeyForEasybus2026-ReplaceThis}
  #     APP_GOOGLE_CLIENTID: ${GOOGLE_CLIENT_ID}
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - easybus-network
